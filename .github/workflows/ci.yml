name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./optimizer/... ./stats/... ./dashboard/...

      - name: Unit tests
        run: go test -race -count=1 ./optimizer/... ./stats/... ./dashboard/...

      - name: Fuzz smoke test
        run: go test ./optimizer -run '^$' -fuzz FuzzOptimize -fuzztime 15s
